name = "physio-market-radar"
main = "src/index.js"
compatibility_date = "2026-11-10"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://abdelhai22-dev.github.io"

# Approximate per-IP protection for the public no-login scan endpoint.
[[ratelimits]]
name = "RADAR_RATE_LIMITER"
namespace_id = "2026111001"

[ratelimits.simple]
limit = 10
period = 60

# Branch Preview configuration. Keep Preview rate-limit counters separate
# from Production by using a distinct namespace ID.
[previews]

[previews.vars]
ALLOWED_ORIGIN = "https://abdelhai22-dev.github.io"

[[previews.ratelimits]]
name = "RADAR_RATE_LIMITER"
namespace_id = "2026111502"

[previews.ratelimits.simple]
limit = 10
period = 60
